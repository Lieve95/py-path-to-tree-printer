[project]
name = "py-path-to-tree-printer"
version = "0.1.1"
description = "Renders flat file paths as an indented ASCII directory tree."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
